name: CI (TypeScript, Tema, Testes e Build)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: front-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validar:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: TypeScript e contraste de tema
        run: npm run lint
      - name: Testes unitários
        run: npm test
      - name: Build de produção (Next.js)
        run: npm run build
